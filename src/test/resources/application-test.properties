# ===============================
# BASE DE DATOS DE PRUEBAS
# ===============================

spring.datasource.url=jdbc:h2:mem:gestionincidencias_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false


# ===============================
# JWT DE PRUEBAS
# ===============================

app.jwt.secret=clave-jwt-exclusiva-para-pruebas-12345678901234567890
app.jwt.expiration-ms=28800000


# ===============================
# CORREO DE PRUEBAS
# ===============================

spring.mail.username=pruebas@example.com
spring.mail.password=pruebas

app.mail.soporte=pruebas@example.com
app.mail.enviar-copia-soporte=false


# ===============================
# FRONTEND
# ===============================

app.frontend.url=http://localhost:8081