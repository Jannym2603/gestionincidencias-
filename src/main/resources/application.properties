spring.application.name=gestionincidencias

# ===============================
# BASE DE DATOS POSTGRESQL
# ===============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_incidencias}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# ===============================
# SERVIDOR
# ===============================

server.port=8081

# Dirección base utilizada para generar enlaces compartidos.
# En desarrollo usa localhost si FRONTEND_URL no está definida.
app.frontend.url=${FRONTEND_URL:http://localhost:8081}


# ===============================
# CORREO
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

app.mail.soporte=${SUPPORT_EMAIL}
app.mail.enviar-copia-soporte=true


# ===============================
# SEGURIDAD JWT
# ===============================

# La clave real debe definirse como variable de entorno.
app.jwt.secret=${JWT_SECRET}

# 8 horas en milisegundos.
app.jwt.expiration-ms=28800000


# ===============================
# MANEJO DE ERRORES
# ===============================

server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=always
