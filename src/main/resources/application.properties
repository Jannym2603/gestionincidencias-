spring.application.name=gestionincidencias

# ===============================
# BASE DE DATOS POSTGRESQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_incidencias
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# SERVIDOR
# ===============================
server.port=8081

# Dirección base utilizada para generar enlaces compartidos.
# En desarrollo utiliza localhost.
# En producción debes colocar la URL real del sistema.
app.frontend.url=${FRONTEND_URL:http://localhost:8081}

# ===============================
# CORREO
# ===============================

# Correo emisor para notificaciones.
# Para Gmail debes usar una contraseña de aplicación,
# no la contraseña normal de tu cuenta.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Correo de soporte
app.mail.soporte=${SUPPORT_EMAIL}
app.mail.enviar-copia-soporte=true

# ===============================
# SEGURIDAD JWT
# ===============================

# Clave utilizada para firmar los tokens.
# Primero intenta leer JWT_SECRET de Windows.
# Si no existe, usa esta clave temporal de desarrollo.
app.jwt.secret=${JWT_SECRET:GestionIncidencias_JWT_2026_ClaveSegura_987654}

# Duración del token en milisegundos.
# 28800000 equivale a 8 horas.
app.jwt.expiration-ms=28800000

# ===============================
# INTEGRACIÓN CON ARANDA ASMS
# ===============================

# Activa o desactiva la integración.
# Debe permanecer en false hasta configurar
# la URL, el token y los identificadores reales.
aranda.api.enabled=${ARANDA_API_ENABLED:false}

# URL del servidor de Aranda.
#
# Puedes configurar:
# https://servidor-empresa.com
#
# o:
# https://servidor-empresa.com/ASMSAPI
#
# El servicio Java completará la ruta /api/v9/item.
aranda.api.url=${ARANDA_API_URL:}

# Token de integración generado desde Aranda.
# No escribas el token real directamente en este archivo.
aranda.api.token=${ARANDA_API_TOKEN:}

# Identificadores propios de la instalación de Aranda.
# Deben ser suministrados por el administrador de ASMS.
aranda.api.project-id=${ARANDA_PROJECT_ID:0}
aranda.api.service-id=${ARANDA_SERVICE_ID:0}
aranda.api.category-id=${ARANDA_CATEGORY_ID:0}
aranda.api.model-id=${ARANDA_MODEL_ID:0}
aranda.api.state-id=${ARANDA_STATE_ID:0}

# Identificadores opcionales del autor y solicitante.
# Si permanecen en 0, el servicio los enviará como null.
aranda.api.author-id=${ARANDA_AUTHOR_ID:0}
aranda.api.applicant-id=${ARANDA_APPLICANT_ID:0}

# Tipo de caso en Aranda.
# 1 = Incidente.
aranda.api.item-type=${ARANDA_ITEM_TYPE:1}

# Tipo de consola.
# 1 = Especialista
# 2 = Cliente
# 3 = Administrador
# 4 = CMDB
aranda.api.console-type=${ARANDA_CONSOLE_TYPE:1}

# Tiempo máximo para establecer conexión con Aranda.
aranda.api.connect-timeout-seconds=${ARANDA_CONNECT_TIMEOUT_SECONDS:15}

# Tiempo máximo para esperar una respuesta de Aranda.
aranda.api.read-timeout-seconds=${ARANDA_READ_TIMEOUT_SECONDS:30}