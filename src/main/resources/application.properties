spring.application.name=gestionincidencias


# ===============================
# BASE DE DATOS POSTGRESQL
# ===============================

# Base utilizada actualmente en esta computadora:
# gestionincidencias
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestionincidencias}
spring.datasource.username=${DB_USERNAME:postgres}

# La contraseña debe venir de una variable de entorno.
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# Durante desarrollo Hibernate puede actualizar la estructura.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# ===============================
# POOL DE CONEXIONES
# ===============================

# Tiempo máximo para obtener una conexión.
spring.datasource.hikari.connection-timeout=20000

# Cantidad máxima de conexiones.
spring.datasource.hikari.maximum-pool-size=10

# Cantidad mínima de conexiones inactivas.
spring.datasource.hikari.minimum-idle=2


# ===============================
# SERVIDOR
# ===============================

server.port=8081

# Dirección base para enlaces compartidos.
app.frontend.url=${FRONTEND_URL:http://localhost:8081}


# ===============================
# ARCHIVOS ADJUNTOS
# ===============================

# Límite máximo por archivo.
spring.servlet.multipart.max-file-size=10MB

# Límite máximo de la petición completa.
spring.servlet.multipart.max-request-size=12MB


# ===============================
# CORREO
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Las credenciales reales deben venir
# de variables de entorno.
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Evita que una conexión de correo bloqueada
# quede esperando indefinidamente.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Correo que recibe copia de las notificaciones.
app.mail.soporte=${SUPPORT_EMAIL}

app.mail.enviar-copia-soporte=true


# ===============================
# SEGURIDAD JWT
# ===============================

# La clave JWT nunca debe escribirse directamente aquí.
# Debe existir como variable de entorno JWT_SECRET.
app.jwt.secret=${JWT_SECRET}

# Duración del token: 8 horas.
app.jwt.expiration-ms=28800000


# ===============================
# MANEJO DE ERRORES
# ===============================

# No exponer stack traces internos al frontend.
server.error.include-stacktrace=never

# No exponer el tipo interno de excepción.
server.error.include-exception=false

# Permite mostrar mensajes controlados de error.
server.error.include-message=always


# ===============================
# LOGGING
# ===============================

logging.level.root=INFO

# Evitar exceso de mensajes SQL.
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF