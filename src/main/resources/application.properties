spring.application.name=gestionincidencias

# ===============================
# BASE DE DATOS POSTGRESQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_incidencias
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# SERVIDOR
# ===============================
server.port=8081

# ===============================
# CORREO
# ===============================

# Correo emisor para notificaciones.
# Para Gmail debes usar una contraseña de aplicación,
# no la contraseña normal de tu cuenta.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Correo de soporte
app.mail.soporte=${SUPPORT_EMAIL}
app.mail.enviar-copia-soporte=true

# ===============================
# SEGURIDAD JWT
# ===============================

# Clave utilizada para firmar los tokens.
# Primero intenta leer JWT_SECRET de Windows.
# Si no existe, usa esta clave temporal de desarrollo.
app.jwt.secret=${JWT_SECRET:GestionIncidencias_JWT_2026_ClaveSegura_987654}

# Duración del token en milisegundos.
# 28800000 equivale a 8 horas.
app.jwt.expiration-ms=28800000